<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Circle</title>
<!--AUTH-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Tokens. Calm by default: cream surfaces, near-black text, hairline borders, one accent. */
  :root {
    --bg: oklch(0.985 0.004 80);
    --bg-2: oklch(0.962 0.006 80);
    --paper: oklch(1 0 0);
    --text: oklch(0.2 0.01 60);
    --text-2: oklch(0.45 0.01 60);
    --text-3: oklch(0.66 0.008 60);
    --line: oklch(0 0 0 / 7%);
    --line-2: oklch(0 0 0 / 13%);
    --accent: oklch(0.42 0.07 200);
    --accent-fg: oklch(0.985 0.004 80);
    --attn: oklch(0.6 0.12 70);
    --radius: 14px;
    --radius-sm: 6px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --chrome: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.2 0.008 70); --bg-2: oklch(0.23 0.008 70); --paper: oklch(0.26 0.008 70);
      --text: oklch(0.93 0.006 80); --text-2: oklch(0.72 0.006 80); --text-3: oklch(0.55 0.006 80);
      --line: oklch(1 0 0 / 8%); --line-2: oklch(1 0 0 / 14%);
      --accent: oklch(0.72 0.08 200); --accent-fg: oklch(0.2 0.008 70); --attn: oklch(0.75 0.12 75);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.2 0.008 70); --bg-2: oklch(0.23 0.008 70); --paper: oklch(0.26 0.008 70);
    --text: oklch(0.93 0.006 80); --text-2: oklch(0.72 0.006 80); --text-3: oklch(0.55 0.006 80);
    --line: oklch(1 0 0 / 8%); --line-2: oklch(1 0 0 / 14%);
    --accent: oklch(0.72 0.08 200); --accent-fg: oklch(0.2 0.008 70); --attn: oklch(0.75 0.12 75);
  }

  * { box-sizing: border-box }
  html, body { height: 100% }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit }
  button { cursor: pointer }

  header { height: var(--chrome); display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header .wordmark { font-weight: 600; letter-spacing: -0.01em }
  header label { color: var(--text-2); font-size: 13px; display: flex; gap: 8px; align-items: center }
  header select { font: inherit; font-size: 13px; color: var(--text); background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 4px 8px }
  header .status { margin-left: auto; color: var(--text-3); font-size: 13px }

  main { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100dvh - var(--chrome)); }
  aside { background: var(--bg-2); border-right: 1px solid var(--line); padding: 20px 16px 28px; overflow: auto; min-height: 0 }
  /* Phones: the thread first and full height; home and memory below it. */
  @media (max-width: 820px) { main { display: flex; flex-direction: column; height: auto } section.chat { order: 0; height: calc(100dvh - var(--chrome)); flex: none } aside { order: 1; border-right: 0; border-top: 1px solid var(--line) } }

  h2 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 20px 0 8px }
  h2:first-child { margin-top: 0 }
  .rooms a { display: block; padding: 7px 10px; border-radius: var(--radius-sm); text-decoration: none; color: var(--text-2); transition: background 160ms var(--ease), color 160ms var(--ease) }
  .rooms a:hover { background: oklch(0 0 0 / 4%) }
  .rooms a.on { background: var(--paper); color: var(--text); box-shadow: 0 1px 2px oklch(0 0 0 / 4%) }

  .tabs { display: flex; gap: 2px; margin: 0 0 8px; border-bottom: 1px solid var(--line) }
  .tabs button { background: none; border: 0; padding: 8px 7px; color: var(--text-2); font-size: 13px; position: relative; white-space: nowrap }
  .tabs button:first-child { padding-left: 2px }
  .tabs button.on { color: var(--text) }
  .tabs button.on::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px }
  .tabs .count[hidden] { display: none }
  .tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--attn); color: var(--paper); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 8px 0; box-shadow: 0 1px 2px oklch(0 0 0 / 3%) }
  .card h4 { margin: 0 0 3px; font-size: 14px; font-weight: 500 }
  .card p { margin: 0; color: var(--text-2); font-size: 13px; white-space: pre-wrap }
  .card .meta { color: var(--text-3); font-size: 12px; margin-top: 4px }
  .card .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap }
  .btn { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); color: var(--text); font-size: 13px; transition: background 140ms var(--ease), border-color 140ms var(--ease) }
  .btn:hover { background: var(--bg-2) }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
  .btn.primary:hover { filter: brightness(1.08) }
  .empty { color: var(--text-2); font-size: 13px; padding: 14px 4px 6px; line-height: 1.5 }
  .empty strong { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px }
  details { margin-top: 20px } summary { cursor: pointer; color: var(--text-2); font-size: 13px; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px }
  summary::-webkit-details-marker { display: none }
  summary::before { content: "›"; display: inline-block; transition: transform 160ms var(--ease); color: var(--text-3) }
  details[open] summary::before { transform: rotate(90deg) }
  .scope { display: inline-block; font-size: 11px; color: var(--text-3); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-right: 6px; line-height: 18px }

  section.chat { display: flex; flex-direction: column; min-height: 0; position: relative }
  .thread { flex: 1; min-height: 0; overflow: auto; padding: 28px 24px 12px; display: flex; flex-direction: column }
  .thread .inner { width: 100%; max-width: 720px; margin: 0 auto; flex: 1; display: flex; flex-direction: column }
  .msg { margin: 0 0 18px; max-width: 86% }
  .msg .who { font-size: 12px; color: var(--text-3); margin: 0 0 4px 2px }
  .msg .body { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; white-space: pre-wrap; box-shadow: 0 1px 2px oklch(0 0 0 / 3%) }
  .msg.me { align-self: flex-end } .msg.me .body { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); box-shadow: none }
  .msg.me .who { text-align: right; margin-right: 2px }
  .msg.system .body { background: transparent; border-style: dashed; color: var(--text-2); font-size: 13px; box-shadow: none }
  .msg.notice .body { background: transparent; border-color: transparent; color: var(--text-2); box-shadow: none; padding-left: 2px }
  .msg .footer { color: var(--text-3); font-size: 12px; margin-top: 8px }
  .steps { margin-top: 8px; font-size: 13px }
  .steps summary { color: var(--text-2) }
  .steps ul { list-style: none; margin: 6px 0 0; padding: 0 0 0 14px }
  .steps li { display: flex; gap: 8px; align-items: baseline; color: var(--text-2); padding: 2px 0 }
  .steps li .ok { color: var(--accent); font-size: 12px } .steps li .x { color: oklch(0.57 0.16 30); font-size: 12px } .steps li .stop { color: var(--text-3); font-size: 12px }
  .working { align-self: flex-start; color: var(--text-2); font-size: 13px; margin: 0 0 18px 2px; display: flex; gap: 8px; align-items: center }
  .working .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s var(--ease) infinite }
  @keyframes pulse { 0%, 100% { opacity: 0.35 } 50% { opacity: 1 } }
  .shimmer { background: linear-gradient(90deg, var(--text-2), var(--text-3), var(--text-2)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite }
  @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .working .dot, .shimmer { animation: none } .shimmer { color: var(--text-2) } }

  /* Empty thread: greeting and three suggestions above a centred composer. */
  .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 0 40px }
  .welcome h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 6px }
  .welcome p { color: var(--text-2); margin: 0 0 22px }
  .welcome .slot { height: 60px; width: 100%; margin-bottom: 18px }  /* where the centred composer sits */
  .sugg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 680px }
  @media (max-width: 640px) { .sugg { grid-template-columns: 1fr } }
  .sugg button { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; color: var(--text); font-size: 14px; line-height: 1.4; min-height: 84px; transition: transform 180ms var(--ease-strong), box-shadow 180ms var(--ease-strong), border-color 180ms var(--ease) }
  .sugg button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px oklch(0 0 0 / 6%); border-color: var(--line-2) }
  .sugg button span { display: block; color: var(--text-3); font-size: 12px; margin-bottom: 6px }
  .another { margin-top: 12px; background: none; border: 0; color: var(--text-3); font-size: 13px }
  .another:hover { color: var(--text-2) }

  form.composer { padding: 10px 24px 14px; background: var(--bg); border-top: 1px solid var(--line); }
  form.composer .box { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 6px 6px 6px 14px; transition: box-shadow 160ms var(--ease), border-color 160ms var(--ease) }
  form.composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(from var(--accent) l c h / 15%) }
  form.composer input { flex: 1; border: 0; outline: 0; background: transparent; padding: 8px 0; min-width: 0 }
  form.composer button { width: 34px; height: 34px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; transition: filter 120ms var(--ease) }
  form.composer button:hover { filter: brightness(1.08) }
  form.composer.centered { position: absolute; left: 0; right: 0; top: 50%; border: 0; background: transparent; padding-top: 0; padding-bottom: 0 }
  form.composer.centered .box { box-shadow: 0 10px 30px oklch(0 0 0 / 7%) }
  .disclaimer { text-align: center; color: var(--text-3); font-size: 12px; max-width: 720px; margin: 8px auto 0 }
  form.composer.centered .disclaimer { visibility: hidden }
  .mut { color: var(--text-2); font-size: 13px }
</style>
</head>
<body>
<header>
  <span class="wordmark">Circle</span>
  <label>You <select id="me"></select></label>
  <span id="status" class="status"></span>
</header>
<main>
  <aside>
    <h2>Rooms</h2>
    <nav class="rooms" id="rooms"></nav>
    <div class="tabs" style="margin-top:22px">
      <button data-tab="input" class="on">Need your input<span class="count" id="count" hidden></span></button>
      <button data-tab="radar">On radar</button>
      <button data-tab="activity">Last activity</button>
    </div>
    <div id="inbox"></div>
    <details><summary>Responsibilities</summary><div id="ledger"></div></details>
    <details><summary>Memory</summary><div id="memory"></div></details>
  </aside>
  <section class="chat">
    <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
    <form class="composer" id="composer"><div class="box"><input id="text" placeholder="Message…" autocomplete="off" /><button aria-label="Send">↑</button></div><div class="disclaimer" id="disclaimer"></div></form>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const state = { people: [], rooms: [], agents: [], me: null, room: null, tab: "input", suggOffset: 0, lastMsgCount: -1 };
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let authToken = null;
const api = async (path, body, method) => {
  const headers = body ? { "content-type": "application/json" } : {};
  if (authToken) headers.authorization = `Bearer ${authToken}`;
  const r = await fetch(path, { method: method ?? (body ? "POST" : "GET"), headers, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { $("#status").textContent = "Sign in required."; throw new Error("unauthorized"); }
  return r.json();
};
try { state.me = localStorage.getItem("circle.me"); state.room = localStorage.getItem("circle.room"); } catch {}

// Clerk sign-in, when the server is configured for it. The signed-in person is "You".
async function ensureAuth() {
  if (!window.__CLERK_PK) return true;
  await new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `https://${window.__CLERK_FAPI}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
    s.setAttribute("data-clerk-publishable-key", window.__CLERK_PK);
    s.async = true; s.crossOrigin = "anonymous"; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  await window.Clerk.load();
  if (!window.Clerk.user) {
    document.querySelector("main").innerHTML = '<div id="signin" style="padding:40px;display:grid;place-items:center"></div>';
    window.Clerk.mountSignIn(document.getElementById("signin"));
    window.Clerk.addListener(({ user }) => { if (user) location.reload(); });
    return false;
  }
  authToken = await window.Clerk.session.getToken();
  setInterval(async () => { authToken = await window.Clerk.session.getToken(); }, 50_000);
  const me = await api("/api/me");
  state.me = me?.id ?? null;
  $("#me").parentElement.outerHTML = `<span class="mut">${esc(me?.displayName ?? "")}</span>`;
  return true;
}

const agentFor = (roomId) => { const r = state.rooms.find((x) => x.id === roomId); return state.agents.find((a) => a.id === r?.agentId); };
const roomOf = (id) => state.rooms.find((r) => r.id === id);
const nameOf = (id) => state.people.find((p) => p.id === id)?.displayName ?? state.agents.find((a) => a.id === id)?.name ?? id;
const fmt = (ms) => ms ? new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; };

async function load() {
  const s = await api("/api/state");
  state.agents = s.agents; state.rooms = s.rooms;
  const people = new Map();
  for (const r of s.rooms) for (const m of r.members) if (m.person) people.set(m.person.id, m.person);
  state.people = [...people.values()];
  if (!window.__CLERK_PK && (!state.me || !people.has(state.me))) state.me = state.people[0]?.id ?? null;
  const mine = s.rooms.filter((r) => r.members.some((m) => m.personId === state.me));
  if (!state.room || !mine.some((r) => r.id === state.room)) state.room = mine[0]?.id ?? null;
  const meSel = $("#me"); if (meSel) meSel.innerHTML = state.people.map((p) => `<option value="${p.id}" ${p.id === state.me ? "selected" : ""}>${esc(p.displayName)}</option>`).join("");
  $("#rooms").innerHTML = mine.map((r) => `<a href="#" data-room="${r.id}" class="${r.id === state.room ? "on" : ""}">${esc(r.name)}</a>`).join("") || `<div class="empty">No rooms yet.</div>`;
  $("#rooms").querySelectorAll("a").forEach((a) => (a.onclick = (e) => { e.preventDefault(); state.room = a.dataset.room; try { localStorage.setItem("circle.room", state.room); } catch {} state.lastMsgCount = -1; load(); }));
  const agent = agentFor(state.room);
  $("#disclaimer").textContent = agent ? `${agent.name} can make mistakes, so double-check.` : "";
  if (!state.agents.length) $("#status").textContent = "No agent yet. Start with SEED_DEMO=1 or POST /api/agents.";
  await Promise.all([renderInbox(), renderThread(), renderMemory(), renderLedger()]);
}
if ($("#me")) $("#me").onchange = (e) => { state.me = e.target.value; try { localStorage.setItem("circle.me", state.me); } catch {} state.lastMsgCount = -1; load(); };
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => { state.tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b)); renderInbox(); }));

async function renderInbox() {
  const agent = agentFor(state.room); const el = $("#inbox"); const count = $("#count");
  if (!agent || !state.me) { el.innerHTML = `<div class="empty">Nothing here yet.</div>`; count.hidden = true; return; }
  const inbox = await api(`/api/inbox?personId=${state.me}&agentId=${agent.id}`);
  count.hidden = !inbox.needsYou.length; count.textContent = inbox.needsYou.length;
  if (state.tab === "input") {
    el.innerHTML = inbox.needsYou.length
      ? inbox.needsYou.map((i) => `<div class="card"><h4>${esc(i.title)}</h4><p>${esc(i.detail)}</p><div class="meta">${esc(roomOf(i.roomId)?.name ?? "")}${i.requesterId ? " · asked by " + esc(nameOf(i.requesterId)) : ""} · ${fmt(i.createdAt)}</div><div class="row">${(i.options ?? []).map((o) => `<button class="btn ${o === "Yes" ? "primary" : ""}" data-answer="${esc(o)}" data-id="${i.id}">${esc(o)}</button>`).join("")}<button class="btn" data-id="${i.id}" data-custom="1">Reply…</button><button class="btn" data-id="${i.id}" data-dismiss="1">Dismiss</button></div></div>`).join("")
      : `<div class="empty"><strong>Nothing needs you right now.</strong>When ${esc(agent.name)} gets stuck on something only you can answer, it waits here.</div>`;
    el.querySelectorAll("button[data-answer]").forEach((b) => (b.onclick = async () => { await api(`/api/attention/${b.dataset.id}/resolve`, { answer: b.dataset.answer, personId: state.me }); load(); }));
    el.querySelectorAll("button[data-custom]").forEach((b) => (b.onclick = async () => { const a = prompt("Your answer"); if (a) { await api(`/api/attention/${b.dataset.id}/resolve`, { answer: a, personId: state.me }); load(); } }));
    el.querySelectorAll("button[data-dismiss]").forEach((b) => (b.onclick = async () => { await api(`/api/attention/${b.dataset.id}/dismiss`, {}); load(); }));
  } else if (state.tab === "radar") {
    const rows = inbox.inFlight.map((r) => `<div class="card"><h4>Working on it</h4><p>${esc(r.trigger)} · started ${fmt(r.startedAt)}${r.status === "waiting" ? " · waiting on someone" : ""}</p></div>`)
      .concat(inbox.radar.map((s) => `<div class="card"><h4>${esc(s.title)}</h4><p>${esc(s.prompt)}</p><div class="meta">${s.nextRunAt ? "Next run " + fmt(s.nextRunAt) : "Scheduled"}${s.paused ? " · paused" : ""}</div><div class="row"><button class="btn" data-pause="${s.id}" data-paused="${s.paused ? 0 : 1}">${s.paused ? "Resume" : "Pause"}</button></div></div>`));
    el.innerHTML = rows.length ? rows.join("") : `<div class="empty"><strong>${esc(agent.name)}'s schedule is empty.</strong>Ask it to do something later, or to check on something, and it schedules itself.</div>`;
    el.querySelectorAll("button[data-pause]").forEach((b) => (b.onclick = async () => { await api(`/api/schedules/${b.dataset.pause}/pause`, { paused: b.dataset.paused === "1" }); renderInbox(); }));
  } else {
    el.innerHTML = inbox.activity.length
      ? inbox.activity.map((r) => `<div class="card"><h4>${esc(r.outcome ?? r.failureReason ?? r.status)}</h4><div class="meta">${esc(roomOf(r.roomId)?.name ?? "")} · ${esc(r.status)} · ${fmt(r.endedAt ?? r.startedAt)}</div></div>`).join("")
      : `<div class="empty"><strong>Nothing finished yet.</strong>What ${esc(agent.name)} gets done shows up here, in its own words.</div>`;
  }
}

const SUGGESTIONS = [
  ["Repair", "Find someone to fix the dripping tap at Mum's this week, under $150."],
  ["Ride", "Set up a ride for Mum's appointment on Thursday and remind whoever drives."],
  ["Phone help", "Walk Mum through sending a photo in iMessage, one step at a time."],
  ["Bill", "Check whether the water bill was paid and track who's paying it next month."],
  ["Recommendation", "Ask around for a Mandarin-speaking dentist near Mum, then compare."],
  ["Reminder", "Every Sunday evening, list what's on this week for the family."],
];

function stepsHtml(steps) {
  if (!steps?.length) return "";
  const done = steps.filter((s) => s.status === "done").length, failed = steps.filter((s) => s.status === "failed").length, stopped = steps.filter((s) => s.status === "stopped").length;
  const label = [`Completed ${done} ${done === 1 ? "step" : "steps"}`, failed ? `${failed} failed` : "", stopped ? `${stopped} stopped` : ""].filter(Boolean).join(" · ");
  return `<details class="steps"><summary>${esc(label)}</summary><ul>${steps.map((s) => `<li>${s.status === "failed" ? '<span class="x">✕</span>' : s.status === "stopped" ? '<span class="stop">○</span>' : s.verified ? '<span class="ok">✓</span>' : '<span class="stop">·</span>'}<span>${esc(s.label)}</span></li>`).join("")}</ul></details>`;
}

// Anchor the centred composer to its slot in the welcome layout.
function placeComposer() {
  const slot = $("#slot"), composer = $("#composer"), chat = document.querySelector("section.chat");
  if (!slot || !composer.classList.contains("centered")) return;
  composer.style.top = `${slot.getBoundingClientRect().top - chat.getBoundingClientRect().top}px`;
}
addEventListener("resize", placeComposer);
function dropComposer() {
  const composer = $("#composer");
  if (!composer.classList.contains("centered")) return;
  const before = composer.getBoundingClientRect().top;
  composer.classList.remove("centered");
  composer.style.top = "";
  const after = composer.getBoundingClientRect().top;
  // The only choreographed motion on the page: the composer slides from the centre to the bottom.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) composer.animate([{ transform: `translateY(${before - after}px)` }, { transform: "translateY(0)" }], { duration: 320, easing: "cubic-bezier(0.32, 0.72, 0, 1)" });
}

async function renderThread() {
  if (!state.room) return;
  const data = await api(`/api/rooms/${state.room}/messages?limit=100`);
  const msgs = data.messages ?? data; const active = data.activeRun;
  const el = $("#inner"); const thread = $("#thread"); const agent = agentFor(state.room); const room = roomOf(state.room);
  if (!msgs.length) {
    const picks = [0, 1, 2].map((i) => SUGGESTIONS[(state.suggOffset + i) % SUGGESTIONS.length]);
    el.innerHTML = `<div class="welcome"><h1>${greeting()}${state.me ? ", " + esc(nameOf(state.me).split(" ")[0]) : ""}.</h1><p>${agent ? `${esc(agent.name)} is in ${esc(room?.name ?? "this room")}. Ask for something, or try one of these.` : "No agent in this room yet."}</p><div class="slot" id="slot"></div><div class="sugg">${picks.map((p) => `<button data-prompt="${esc(p[1])}"><span>${esc(p[0])}</span>${esc(p[1])}</button>`).join("")}</div><button class="another" id="another">Show others</button></div>`;
    el.querySelectorAll(".sugg button").forEach((b) => (b.onclick = () => send(b.dataset.prompt)));
    $("#another").onclick = () => { state.suggOffset = (state.suggOffset + 3) % SUGGESTIONS.length; renderThread(); };
    $("#composer").classList.add("centered");
    placeComposer();
    $("#text").placeholder = agent ? `Ask ${agent.name} anything…` : "Message…";
    return;
  }
  dropComposer();
  $("#text").placeholder = agent ? `Message ${agent.name}…` : "Message…";
  let html = msgs.map((m) => {
    const who = m.role === "assistant" ? (agent?.name ?? "Agent") : m.role === "system" ? `${agent?.name ?? "Agent"} · ${m.source ?? "note"}` : nameOf(m.authorId);
    const cls = m.role === "user" && m.authorId === state.me ? "me" : m.role === "system" ? "system" : m.source === "notice" ? "notice" : "";
    let body = esc(m.text), footer = "";
    const fi = m.role === "assistant" ? m.text.lastIndexOf("\n— ") : -1;
    if (fi > 0) { body = esc(m.text.slice(0, fi)); footer = m.text.slice(fi + 1); }
    return `<div class="msg ${cls}"><div class="who">${esc(who)} · ${fmt(m.at)}</div><div class="body">${body}${m.steps?.length ? stepsHtml(m.steps) : footer ? `<div class="footer">${esc(footer)}</div>` : ""}</div></div>`;
  }).join("");
  if (active && active.status === "running") {
    const running = active.steps.find((s) => s.status === "running");
    html += `<div class="working"><span class="dot"></span><span class="shimmer">${esc(running ? running.label : `${agent?.name ?? "Agent"} is working…`)}</span></div>`;
  } else if (active && active.status === "waiting") {
    html += `<div class="working"><span class="dot" style="background:var(--attn);animation:none"></span><span>${esc(agent?.name ?? "Agent")} is waiting on someone.</span></div>`;
  }
  el.innerHTML = html;
  if (msgs.length !== state.lastMsgCount) { thread.scrollTop = thread.scrollHeight; state.lastMsgCount = msgs.length; }
}

async function renderMemory() {
  const agent = agentFor(state.room); const el = $("#memory");
  if (!agent) { el.innerHTML = ""; return; }
  const { memories } = await api(`/api/memory?agentId=${agent.id}`);
  const scopeName = (m) => m.scope === "agent" ? "everywhere" : m.scope === "room" ? (roomOf(m.scopeId)?.name ?? "room") : nameOf(m.scopeId);
  el.innerHTML = (memories.length ? memories.map((m) => `<div class="card"><p><span class="scope">${esc(scopeName(m))}</span><span class="scope">${esc(m.type)}</span>${esc(m.text)}</p><div class="meta">${esc(new Date(m.statedAt).toISOString().slice(0, 10))}</div><div class="row"><button class="btn" data-forget="${m.id}">Forget</button></div></div>`).join("") : `<div class="empty">Nothing learned yet.</div>`) + `<div class="row" style="margin-top:8px"><button class="btn" id="tidy">Tidy up now</button></div>`;
  el.querySelectorAll("button[data-forget]").forEach((b) => (b.onclick = async () => { await api(`/api/memory/${b.dataset.forget}`, null, "DELETE"); renderMemory(); }));
  $("#tidy").onclick = async () => { $("#tidy").textContent = "Tidying…"; await api("/api/memory/consolidate", { agentId: agent.id }); renderMemory(); };
}
async function renderLedger() {
  if (!state.room) return;
  const cs = await api(`/api/commitments?roomId=${state.room}`);
  $("#ledger").innerHTML = cs.length ? cs.map((c) => `<div class="card"><h4>${esc(c.title)}</h4><p>${esc(nameOf(c.ownerId))}${c.beneficiaryId ? " for " + esc(nameOf(c.beneficiaryId)) : ""}</p><div class="meta">${c.dueAt ? "due " + fmt(c.dueAt) + " · " : ""}${esc(c.status)}</div></div>`).join("") : `<div class="empty">No open responsibilities.</div>`;
}

async function send(text) {
  if (!text || !state.room || !state.me) return;
  $("#text").value = ""; $("#status").textContent = "";
  const inner = $("#inner");
  if ($("#composer").classList.contains("centered")) inner.innerHTML = "";
  // Show the message at once; the run follows.
  inner.insertAdjacentHTML("beforeend", `<div class="msg me"><div class="who">${esc(nameOf(state.me))}</div><div class="body">${esc(text)}</div></div><div class="working"><span class="dot"></span><span class="shimmer">${esc(agentFor(state.room)?.name ?? "Agent")} is working…</span></div>`);
  dropComposer();
  $("#thread").scrollTop = $("#thread").scrollHeight;
  await api(`/api/rooms/${state.room}/messages`, { personId: state.me, text, dedupKey: `${state.me}:${Date.now()}` });
  load();
}
$("#composer").onsubmit = (e) => { e.preventDefault(); send($("#text").value.trim()); };

// Live deliveries: NDJSON stream; re-render when something lands.
(async function watch() {
  for (;;) {
    try {
      const headers = authToken ? { authorization: `Bearer ${authToken}` } : {};
      const res = await fetch("/api/deliveries/watch", { headers }); const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line) continue;
          try { const d = JSON.parse(line); if (d.type === "delivery") { if (d.roomId === state.room) renderThread(); renderInbox(); renderLedger(); } } catch {} }
      }
    } catch {}
    await new Promise((r) => setTimeout(r, 2000));
  }
})();
ensureAuth().then((ok) => { if (ok) load(); }).catch((e) => { $("#status").textContent = "Sign-in failed to load: " + e; });
</script>
</body>
