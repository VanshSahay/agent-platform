<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Circle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23245c6b' stroke-width='3'/%3E%3C/svg%3E" />
<!--AUTH-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@700;800;900&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body data-tab="chat">
<div class="app" id="app">
  <header>
    <span class="wordmark">Circle</span>
    <span class="reach" id="reach"></span>
    <nav class="pages" id="pages" aria-label="Pages">
      <a href="#chat" data-page="chat" class="on">Chat</a>
      <a href="#memory" data-page="memory">Memory</a>
      <a href="#settings" data-page="settings">Settings</a>
    </nav>
    <span class="grow"></span>
    <button class="ghost" id="homeToggle" type="button" aria-expanded="false" aria-controls="home">Home<span class="count" id="countHead" hidden></span></button>
    <label class="you" id="youPick">You <select id="me"></select></label>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </header>

  <div class="cols">
    <aside class="nav" id="nav">
      <input id="search" class="search" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats" />
      <div id="results" hidden></div>
      <h2>Rooms <button class="link" id="newRoom" type="button">+ New room</button></h2>
      <nav class="rooms" id="rooms"></nav>
      <div id="roomForm"></div>
      <h2>People <button class="link" id="newPerson" type="button">+ Add</button></h2>
      <div class="people" id="people"></div>
      <div id="personForm"></div>
    </aside>

    <section class="center" id="center">
      <div class="page chat" id="pageChat">
        <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
        <form class="composer" id="composer"><div class="pending" id="pending" hidden></div><div class="box"><button class="attach" id="attach" type="button" aria-label="Attach a photo or file"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 6.5 7.8 12.2a1.8 1.8 0 0 0 2.5 2.5l6-6a3.5 3.5 0 0 0-5-5l-6.2 6.2a5.2 5.2 0 0 0 7.4 7.4l4-4"/></svg></button><input id="file" type="file" multiple hidden accept="image/*,.pdf,.txt,.csv,.md,.doc,.docx,.xls,.xlsx" /><input id="text" placeholder="Message…" autocomplete="off" /><button aria-label="Send" type="submit">↑</button></div><div class="disclaimer" id="disclaimer"></div></form>
      </div>
      <div class="page doc" id="pageSettings" hidden><div class="inner" id="settings"></div></div>
      <div class="page doc" id="pageMemory" hidden><div class="inner" id="memory"></div></div>
    </section>

    <aside class="home" id="home">
      <div id="start"></div>
      <div class="tabs">
        <button data-tab="input" class="on" type="button">Need your input<span class="count" id="count" hidden></span></button>
        <button data-tab="radar" type="button">On radar</button>
        <button data-tab="activity" type="button">Last activity</button>
      </div>
      <div id="inbox"></div>
      <h2 style="margin-top:26px">Responsibilities</h2>
      <div id="ledger"></div>
    </aside>
  </div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="chat" class="on" type="button"><svg class="glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h9A2.5 2.5 0 0 1 17 5.5v6a2.5 2.5 0 0 1-2.5 2.5H8l-4 3v-3A2.5 2.5 0 0 1 3 11.5z"/></svg>Chat</button>
    <button data-tab="home" type="button"><svg class="glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5 10 3l7 6.5V16a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1z"/></svg>Home<span class="count" id="countTab" hidden></span></button>
    <button data-tab="rooms" type="button"><svg class="glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="2.5"/><circle cx="13.5" cy="8" r="2"/><path d="M2.5 15.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4M11.5 14.5c.3-1.8 1.5-2.8 3.2-2.8 1.5 0 2.8 1 2.8 3"/></svg>Rooms</button>
    <button data-tab="settings" type="button"><svg class="glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M5 15l1.4-1.4M13.6 6.4 15 5"/></svg>Settings</button>
  </nav>

  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="head"><h3 id="drawerTitle">Why</h3><button class="close" id="drawerClose" type="button" aria-label="Close">×</button></div>
    <div class="body" id="drawerBody"></div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
