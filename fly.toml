# Fly.io: the whole app in the cloud (API, web app, channels, reminders) on Postgres, no Temporal needed (the built-in engine runs
# the agents in-process). One always-on machine: agents keep schedules, watches and follow-ups, so it must never auto-stop.
# Deploy: see deploy/CLOUD.md. Builds happen on Fly's builders (no Docker needed locally).
app = "agent-platform-ellie"
primary_region = "ewr"

[build]
  dockerfile = "deploy/Dockerfile.server"

[env]
  ENGINE = "local"
  PRODUCTION = "1"
  PORT = "3000"
  WORKER_CONCURRENCY = "4"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
